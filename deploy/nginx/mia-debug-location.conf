# Place these exact-match locations before the general `location ^~ /mia/`
# block in the apimaster.ai HTTPS server. The subrequest keeps the login cookie
# and account allowlist at APIMaster's authentication boundary.
location = /mia/debug {
    auth_request /_mia_debug_auth;
    error_page 401 = @mia_debug_login;
    error_page 403 =404 @mia_debug_not_found;

    proxy_pass http://172.17.0.1:3010;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
}

location ^~ /api/mia/debug/ {
    proxy_pass http://apimaster_next;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
}

location = /_mia_debug_auth {
    internal;
    proxy_pass http://apimaster_next/api/mia/debug/access;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location @mia_debug_login {
    return 302 /login?next=/mia/debug;
}

location @mia_debug_not_found {
    return 404;
}
