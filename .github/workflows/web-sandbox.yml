name: Web Sandbox

on:
  push:
    branches: [main, "codex/mia-de-roma-sandbox"]
    paths:
      - "sandbox/**"
      - ".github/workflows/web-sandbox.yml"
  pull_request:
    paths:
      - "sandbox/**"
      - ".github/workflows/web-sandbox.yml"
  workflow_dispatch:

concurrency:
  group: mia-web-sandbox-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  test-build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test
        working-directory: sandbox
        run: npm test && npm run check
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: ./sandbox
          file: ./sandbox/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/lisaluoyf/mia-web-sandbox:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Publish image for anonymous pull
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method PATCH \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            /user/packages/container/mia-web-sandbox \
            -f visibility=public
      - name: Summary
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "## Mia Web Sandbox"
            echo ""
            echo "Image: \`ghcr.io/lisaluoyf/mia-web-sandbox:sha-${{ github.sha }}\`"
            echo "Digest: \`${{ steps.build.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
